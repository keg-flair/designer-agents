name: Checks

on:
  push:
  pull_request:

jobs:
  preflight:
    name: Repo Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run repo preflight
        run: python3 scripts/check_repo.py

      - name: Validate eval fixtures
        run: python3 scripts/agent_eval_harness.py validate

      - name: Compile Python scripts
        run: PYTHONPYCACHEPREFIX=.pycache python3 -m py_compile scripts/check_repo.py scripts/agent_eval_harness.py
